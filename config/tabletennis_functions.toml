# Function boundary overrides for Rockstar Games Presents Table Tennis codegen.
#
# The automatic scanner mis-splits or mis-merges some functions. Each entry here
# pins a boundary the scanner got wrong. Add entries as `generate-all` reports
# unresolved calls or the recompiled build misbehaves at a known address.
#
# Entry forms:
#   "0xADDR" = { end = 0xADDR }              explicit end address
#   "0xADDR" = { end = 0xADDR, parent = 0x } tail/branch belonging to a parent
#   "0xADDR" = { name = "..." }              give a function a readable name
#
# Image base is 0x82000000 (see docs/xex.md).

[functions]

# A pair of near-identical virtual-call dispatchers, each reached only by a
# tail-branch from a C++ adjustor thunk (`addi r3,r3,4` then `b`) at
# 0x82468A38 and 0x82468A40. Nothing ever *calls* them, so the scanner never
# registered them as function starts and reported "target not in any function".
#
# Both open with `clrlwi r11,r4,24; cmplwi cr6,r11,2` and are 0xC8 bytes long,
# each ending in a `blr` immediately before the next one begins.
"0x8245FD08" = { end = 0x8245FDD0 }
"0x8245FDD0" = { end = 0x8245FE98 }

# Same situation: branched to from 0x82245464, never called. Starts after the
# `blr` at 0x8224673C and ends at the `blr` at 0x822467F4; the next function's
# prologue (mflr r12) is at 0x822467F8.
"0x82246740" = { end = 0x822467F8 }

# Vtable dispatch trampolines: `lwz r12,0(r3); lwz r11,N(r12); mtctr r11; bctr`.
# They are only ever reached through a vtable slot, so nothing references them
# statically and the scanner leaves them unregistered - an indirect call then
# traps with "invalid or unregistered function". 0x8211CC58 is the one that
# aborted the first boot; the rest are the same shape, each 16 bytes, each
# preceded by a terminator and never a branch target (so they are genuinely
# standalone, not tail-dispatch code inside a larger function).
"0x8211CC58" = { end = 0x8211CC68 }
"0x8211CC68" = { end = 0x8211CC78 }
"0x8211CC78" = { end = 0x8211CC88 }
"0x8228D9C0" = { end = 0x8228D9D0 }
"0x8228D9D0" = { end = 0x8228D9E0 }
"0x8228D9E0" = { end = 0x8228D9F0 }

# Tiny leaf stubs used as vtable slots (`return <constant>`, `bctr` forwarders
# and similar). Each is referenced from a run of >=3 consecutive code pointers
# (vtable shape), starts after a terminator or padding, is under 8 instructions,
# contains no branches, ends in blr/bctr, and is never a static branch target.
# Nothing calls them directly, so the scanner leaves them unregistered and the
# first indirect call through the slot aborts. 0x82464E40 (`return E_INVALIDARG`)
# was the abort that motivated this sweep.
"0x820CE42C" = { end = 0x820CE434 }
"0x820CE434" = { end = 0x820CE43C }
"0x820CE43C" = { end = 0x820CE444 }
"0x820CE444" = { end = 0x820CE44C }
