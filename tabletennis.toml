# Runtime config for the recompiled Table Tennis build.
#
# The app loads "<exe dir>/tabletennis.toml", so this file has to sit next to
# the executable - copy it into out/build/<preset>/ after building.

game_data_root = "game"

# macOS always uses the SDL backend; real controllers work through it as-is.
input_backend = "sdl"

# Keyboard-to-controller emulation. Off by default in the SDK, so the title
# screen ignores the keyboard until this is on.
mnk_mode = true
mnk_capture_mouse = false
mnk_user_index = 0
mnk_sensitivity = 1.0

# Defaults, restated so the bindings are visible in one place.
# Left stick   W / A / S / D          (press: Shift)
# Right stick  mouse                  (press: MMB)
# A B X Y      Space / C / E / F
# Triggers     LT = RMB, RT = LMB
# Shoulders    LB = Q,   RB = R
# D-pad        arrow keys
# Back/Start   Tab / Return
keybind_a = "Space"
keybind_b = "C"
keybind_x = "E"
keybind_y = "F"
keybind_left_trigger = "RMB"
keybind_right_trigger = "LMB"
keybind_left_shoulder = "Q"
keybind_right_shoulder = "R"
keybind_lstick_up = "W"
keybind_lstick_down = "S"
keybind_lstick_left = "A"
keybind_lstick_right = "D"
keybind_lstick_press = "Shift"
keybind_rstick_press = "MMB"
keybind_dpad_up = "Up"
keybind_dpad_down = "Down"
keybind_dpad_left = "Left"
keybind_dpad_right = "Right"
keybind_back = "Tab"
keybind_start = "Return"

fullscreen = false

# Keep normal local runs silent while preserving the emulated audio clock.
audio_mute = true

# --- Frame pacing -----------------------------------------------------------
# With vsync off and no present limiter the guest vblank free-runs, so the game
# advances its own clock faster than the console did - which is why the intro
# video and menus play too fast. Pacing vblank fixes the speed, not the frame
# rate.
vsync = true
vblank_host_clock_pacing = true
video_mode_refresh_rate = 60.0

# --- Shader compilation -----------------------------------------------------
# The SDK disables async shader compilation on macOS (`!REX_PLATFORM_MAC`), so
# every new pipeline is built on the frame that first needs it - the stutter
# when entering a new screen. Turning it on trades that for brief pop-in while
# pipelines warm up. If it introduces instability under MoltenVK, set it back
# to false: the default is presumably deliberate.
async_shader_compilation = true

# Persist compiled shaders so subsequent runs skip the warm-up entirely.
store_shaders = true

# --- Draw resolution --------------------------------------------------------
# THE important setting. The SDK defaults these to 2, which supersamples the
# 1280x720 guest framebuffer to 2560x1440 - 4x the pixels, and the SDK itself
# warns the path "is experimental and may not affect all titles correctly".
#
# Setting all three to 1 renders at native guest resolution, which is a large
# fragment-cost saving on its own and is worth having regardless.
#
# It is ALSO a candidate fix for the black character skin - but that is NOT
# yet confirmed. The screenshots that looked like a fix were the attract
# video, not real-time geometry. Verify on the Exhibition character-select
# screen before believing it.
resolution_scale = 1
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1

# macOS protects guest memory in 16 KiB host pages while many Xenos resources
# occupy smaller disjoint byte ranges. A GPU write beside a watched texture
# used to invalidate and reconvert that texture even when the exact byte
# envelopes did not overlap. Table Tennis telemetry measured 67-83 such
# page-only collisions per 256 GPU writes; exact filtering improved the live
# gameplay baseline without changing CPU/global invalidation semantics.
shared_memory_filter_gpu_page_only_watches = true

# --- Diagnostics ------------------------------------------------------------
show_fps_counter = true
